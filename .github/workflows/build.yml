name: Build JDBC Driver

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      env:
        mssql_jdbc_test_connection_properties: ${{ secrets.MSSQL_BUILD_INSTANCE }}
      run: mvn install -Pjre17
    
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: mssql-jdbc-jre17
        path: target/mssql-jdbc-*.jar
        if-no-files-found: error
        retention-days: 30
